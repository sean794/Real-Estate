name: 서울 아파트 데이터 매일 업데이트

on:
  schedule:
    - cron: "0 15 * * *"   # 매일 한국시간 자정 (UTC 15:00)
  workflow_dispatch:         # 수동 실행 버튼도 활성화

permissions:
  contents: write            # CSV 커밋을 위해 필요

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install requests pandas

      - name: 데이터 수집 실행
        env:
          MOLIT_TRADE_API_KEY: ${{ secrets.MOLIT_TRADE_API_KEY }}
          MOLIT_RENT_API_KEY:  ${{ secrets.MOLIT_RENT_API_KEY }}
        run: python scripts/fetch_data.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data/
          git diff --cached --quiet || git commit -m "chore: 데이터 자동 업데이트 $(date +'%Y-%m-%d')"
          git push
